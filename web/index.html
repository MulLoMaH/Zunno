<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070912" />
  <title>Zunno — совместное планирование</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="/styles.css?v=40" />
  <link rel="stylesheet" href="/vendor/driver.css" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Zunno" />
  <meta name="mobile-web-app-capable" content="yes" />
</head>
<body>
  <div id="preloader" class="preloader" aria-hidden="true">
    <div class="preloader-orbit">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root"></div>
  <div id="popover-root"></div>
  <div id="tooltip-root"></div>

  <div
    id="command-palette"
    class="cmdk hidden"
    role="dialog"
    aria-modal="true"
    aria-label="Командная палитра"
  >
    <div class="cmdk-panel glass-strong">
      <div class="cmdk-search">
        <span data-icon="search" data-size="sm"></span>
        <input
          id="command-input"
          type="text"
          placeholder="Разделы, группы, действия..."
          autocomplete="off"
          spellcheck="false"
        />
        <kbd>ESC</kbd>
      </div>
      <div id="command-list" class="cmdk-list" role="listbox" aria-label="Команды"></div>
    </div>
  </div>

  <!-- AUTH -->
  <main id="screen-auth" class="screen-auth hidden">
    <div class="auth-shell">
      <button
        type="button"
        class="icon-btn auth-theme-btn"
        data-theme-toggle
        data-tip="Переключить тему"
        aria-label="Переключить тему"
      >
        <span data-theme-icon></span>
      </button>

      <div class="auth-brand">
        <img src="/icon.svg" alt="Zunno" class="brand-logo" />
        <h1 class="auth-title">Zunno</h1>
        <p class="auth-subtitle">Планируйте вместе. Тратьте осознанно.</p>
      </div>

      <div class="auth-panel glass">
        <div class="segmented" role="tablist" aria-label="Переключение формы">
          <button class="segmented-btn is-active" data-tab="login" type="button" role="tab">Вход</button>
          <button class="segmented-btn" data-tab="register" type="button" role="tab">Регистрация</button>
          <div class="segmented-thumb" aria-hidden="true"></div>
        </div>

        <form id="form-login" class="form" novalidate>
          <label class="field">
            <span class="field-label">Телефон</span>
            <input
              name="phone_number"
              type="tel"
              inputmode="tel"
              autocomplete="tel"
              placeholder="+7 999 123-45-67"
              required
            />
          </label>

          <label class="field">
            <span class="field-label">Пароль</span>
            <input
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="••••••••"
              required
            />
          </label>

          <button type="submit" class="btn btn-primary btn-lg btn-block">
            <span data-icon="login" data-size="sm"></span>
            <span>Войти</span>
          </button>
        </form>

        <form id="form-register" class="form hidden" novalidate>
          <label class="field">
            <span class="field-label">Имя</span>
            <input
              name="full_name"
              type="text"
              autocomplete="name"
              placeholder="Иван Иванов"
              minlength="3"
              maxlength="100"
              required
            />
          </label>

          <label class="field">
            <span class="field-label">Возраст</span>
            <input
              name="age"
              type="number"
              inputmode="numeric"
              placeholder="25"
              min="18"
              max="100"
              required
            />
          </label>

          <label class="field">
            <span class="field-label">Телефон</span>
            <input
              name="phone_number"
              type="tel"
              inputmode="tel"
              autocomplete="tel"
              placeholder="+79991234567"
              required
            />
            <span class="field-hint">Формат: +79991234567</span>
          </label>

          <label class="field">
            <span class="field-label">Пароль</span>
            <input
              name="password"
              type="password"
              autocomplete="new-password"
              placeholder="Минимум 8 символов"
              minlength="8"
              required
            />
          </label>

          <button type="submit" class="btn btn-primary btn-lg btn-block">
            <span data-icon="sparkles" data-size="sm"></span>
            <span>Создать аккаунт</span>
          </button>
        </form>
      </div>
    </div>
  </main>

  <!-- APP -->
  <div id="screen-app" class="screen-app hidden" data-sidebar="expanded">
    <aside class="sidebar glass-strong">
      <div class="sidebar-head">
        <img src="/icon.svg" alt="" class="brand-logo sm" aria-hidden="true" />
        <div class="brand-text">
          <div class="brand-title">Zunno</div>
          <div class="brand-sub">Совместный бюджет и планы</div>
        </div>
        <button
          type="button"
          id="sidebar-collapse"
          class="icon-btn sm desktop-only"
          data-tip="Свернуть меню"
          aria-label="Свернуть меню"
        >
          <span data-icon="panelLeft"></span>
        </button>
      </div>

      <nav class="sidebar-nav" aria-label="Основная навигация">
        <div class="nav-section-label nav-label">Работа</div>

        <button type="button" class="nav-item is-active" data-view="dashboard" data-tip="Обзор">
          <span data-icon="dashboard" data-size="sm"></span>
          <span class="nav-label">Обзор</span>
        </button>

        <button type="button" class="nav-item" data-view="goals" data-tip="Цели">
          <span data-icon="target" data-size="sm"></span>
          <span class="nav-label">Цели</span>
        </button>

        <button type="button" class="nav-item" data-view="budget" data-tip="Бюджет">
          <span data-icon="wallet" data-size="sm"></span>
          <span class="nav-label">Бюджет</span>
        </button>

        <button type="button" class="nav-item" data-view="plans" data-tip="Планы">
          <span data-icon="calendar" data-size="sm"></span>
          <span class="nav-label">Планы</span>
        </button>

        <div class="nav-section-label nav-label">Аккаунт</div>

        <button type="button" class="nav-item" data-view="profile" data-tip="Профиль">
          <span data-icon="user" data-size="sm"></span>
          <span class="nav-label">Профиль</span>
        </button>
      </nav>

      <div class="sidebar-group-block">
        <div class="sidebar-label nav-label">Группы</div>
        <div id="sidebar-group-list" class="sidebar-group-list"></div>

        <div class="sidebar-group-actions">
          <button type="button" class="btn btn-ghost btn-sm btn-block" id="btn-new-group" data-tip="Создать группу">
            <span data-icon="plus" data-size="sm"></span>
            <span class="nav-label">Создать группу</span>
          </button>

          <button type="button" class="btn btn-ghost btn-sm btn-block" id="btn-join-group" data-tip="Присоединиться по ID">
            <span data-icon="login" data-size="sm"></span>
            <span class="nav-label">Присоединиться</span>
          </button>
        </div>
      </div>

      <div class="sidebar-user" id="sidebar-user"></div>
    </aside>

    <main class="main">
      <header class="topbar glass-strong">
        <button type="button" class="group-pill" id="group-switcher-btn" data-tip="Переключить группу">
          <span class="group-avatar" id="topbar-group-avatar" aria-hidden="true">?</span>
          <span class="group-pill-info">
            <span class="group-pill-name" id="topbar-group-name">—</span>
            <span class="group-pill-meta" id="topbar-group-meta"></span>
          </span>
          <span class="group-pill-caret" data-icon="chevronDown" data-size="sm"></span>
        </button>

        <div class="topbar-actions">
          <button
            type="button"
            class="icon-btn badge-btn"
            id="invitations-btn"
            data-tip="Приглашения"
            aria-label="Приглашения"
          >
            <span data-icon="bell"></span>
            <span id="invitation-badge" class="badge hidden">0</span>
          </button>

          <button
            type="button"
            class="icon-btn hide-xs"
            id="command-btn"
            data-tip="Команды (Ctrl+K)"
            aria-label="Командная палитра"
          >
            <span data-icon="command"></span>
          </button>

          <button
            type="button"
            class="icon-btn"
            id="theme-toggle-btn"
            data-theme-toggle
            data-tip="Переключить тему"
            aria-label="Переключить тему"
          >
            <span data-theme-icon></span>
          </button>

          <button type="button" class="avatar-btn" id="user-menu-btn" data-tip="Меню пользователя" aria-label="Меню пользователя"></button>
        </div>
      </header>

      <section class="view" id="view"></section>
    </main>

    <nav class="mobile-nav" aria-label="Мобильная навигация">
      <button type="button" class="mobile-nav-item is-active" data-view="dashboard">
        <span data-icon="dashboard" data-size="sm"></span>
        <span class="mobile-nav-label">Обзор</span>
      </button>

      <button type="button" class="mobile-nav-item" data-view="goals">
        <span data-icon="target" data-size="sm"></span>
        <span class="mobile-nav-label">Цели</span>
      </button>

      <button type="button" class="mobile-nav-item" data-view="budget">
        <span data-icon="wallet" data-size="sm"></span>
        <span class="mobile-nav-label">Бюджет</span>
      </button>

      <button type="button" class="mobile-nav-item" data-view="plans">
        <span data-icon="calendar" data-size="sm"></span>
        <span class="mobile-nav-label">Планы</span>
      </button>

      <button type="button" class="mobile-nav-item" data-view="profile">
        <span data-icon="user" data-size="sm"></span>
        <span class="mobile-nav-label">Профиль</span>
      </button>
    </nav>
  </div>

  <!-- FAB -->
  <div id="fab" class="fab-wrap" aria-label="Быстрые действия">
    <div class="fab-menu" id="fab-menu">
      <button type="button" class="fab-item" data-action="expense">
        <span class="fab-label">Расход</span>
        <span class="fab-icon danger"><span data-icon="arrowDownCircle" data-size="sm"></span></span>
      </button>

      <button type="button" class="fab-item" data-action="income">
        <span class="fab-label">Доход</span>
        <span class="fab-icon success"><span data-icon="arrowUpCircle" data-size="sm"></span></span>
      </button>

      <button type="button" class="fab-item" data-action="plan">
        <span class="fab-label">Событие</span>
        <span class="fab-icon accent"><span data-icon="calendarPlus" data-size="sm"></span></span>
      </button>

      <button type="button" class="fab-item" data-action="goal">
        <span class="fab-label">Цель</span>
        <span class="fab-icon primary"><span data-icon="target" data-size="sm"></span></span>
      </button>
    </div>

    <button type="button" id="fab-main" class="fab-main" aria-label="Быстрые действия" aria-expanded="false">
      <span data-icon="plus"></span>
    </button>
  </div>

  <script src="/vendor/driver.js?v=40"></script>
  <script src="/vendor/sortable.min.js?v=40"></script>
  <script src="/app.js?v=40"></script>
</body>
</html>
