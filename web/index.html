<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zunno · Планируйте вместе</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- ========== Декоративный фон ========== -->
<div class="bg">
  <div class="orb orb-cyan"></div>
  <div class="orb orb-violet"></div>
  <div class="orb orb-pink"></div>
  <div class="bg-grid"></div>
  <div class="bg-noise"></div>
</div>

<!-- ========== Toast-контейнер ========== -->
<div id="toasts" class="toasts"></div>

<!-- ========== Модалка ========== -->
<div id="modal-root"></div>

<!-- ========== Preloader ========== -->
<div id="preloader" class="preloader">
  <div class="loader-ring"></div>
</div>

<!-- =====================================================
     ЭКРАН АВТОРИЗАЦИИ
     ===================================================== -->
<main id="screen-auth" class="screen-auth hidden">
  <div class="auth-wrap">

    <div class="auth-brand">
      <div class="brand-logo">Z</div>
      <h1 class="brand-name">Zunno</h1>
      <p class="brand-tag">Планируйте вместе.<br>Тратьте осознанно.</p>
    </div>

    <div class="auth-card glass">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Вход</button>
        <button class="auth-tab" data-tab="register">Регистрация</button>
        <div class="auth-tab-indicator"></div>
      </div>

      <!-- LOGIN -->
      <form id="form-login" class="auth-form">
        <label class="field">
          <span class="field-label">Телефон</span>
          <input name="phone_number" type="tel" placeholder="+79991234567" required autocomplete="tel">
        </label>
        <label class="field">
          <span class="field-label">Пароль</span>
          <input name="password" type="password" placeholder="••••••••" required autocomplete="current-password">
        </label>
        <button type="submit" class="btn btn-primary btn-block">
          <span>Войти</span>
        </button>
        <p class="auth-hint">Нет аккаунта? <a href="#" data-tab-switch="register">Создать</a></p>
      </form>

      <!-- REGISTER -->
      <form id="form-register" class="auth-form hidden">
        <label class="field">
          <span class="field-label">Имя</span>
          <input name="full_name" type="text" placeholder="Иван Иванов" required minlength="3" maxlength="100" autocomplete="name">
        </label>
        <label class="field">
          <span class="field-label">Возраст</span>
          <input name="age" type="number" placeholder="25" required min="18" max="100">
        </label>
        <label class="field">
          <span class="field-label">Телефон</span>
          <input name="phone_number" type="tel" placeholder="+79991234567" required pattern="^\+[0-9]{9,14}$" autocomplete="tel">
        </label>
        <label class="field">
          <span class="field-label">Пароль</span>
          <input name="password" type="password" placeholder="Минимум 8 символов" required minlength="8" autocomplete="new-password">
        </label>
        <button type="submit" class="btn btn-primary btn-block">
          <span>Создать аккаунт</span>
        </button>
        <p class="auth-hint">Уже есть аккаунт? <a href="#" data-tab-switch="login">Войти</a></p>
      </form>
    </div>

  </div>
</main>

<!-- =====================================================
     ЭКРАН ПРИЛОЖЕНИЯ
     ===================================================== -->
<div id="screen-app" class="screen-app hidden">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar glass">

    <div class="sidebar-brand">
      <div class="brand-logo sm">Z</div>
      <span>Zunno</span>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-view="dashboard">
        <span class="nav-ico">◫</span>
        <span>Обзор</span>
      </button>
      <button class="nav-item" data-view="goals">
        <span class="nav-ico">✦</span>
        <span>Цели</span>
      </button>
      <button class="nav-item" data-view="budget">
        <span class="nav-ico">◈</span>
        <span>Бюджет</span>
      </button>
      <button class="nav-item" data-view="plans">
        <span class="nav-ico">✎</span>
        <span>Планы</span>
      </button>
      <button class="nav-item" data-view="profile">
        <span class="nav-ico">◉</span>
        <span>Профиль</span>
      </button>
    </nav>

    <div class="sidebar-section">
      <div class="section-label">Активная группа</div>
      <select id="group-select" class="select"></select>
      <button class="btn btn-ghost btn-sm btn-block" id="btn-new-group">
        <span>+ Создать группу</span>
      </button>
      <button class="btn btn-ghost btn-sm btn-block" id="btn-join-group">
        <span>Присоединиться по телефону</span>
      </button>
    </div>

    <div class="sidebar-user" id="sidebar-user"></div>
  </aside>

  <!-- ===== CONTENT ===== -->
  <main class="content">

    <header class="topbar glass">
      <div class="topbar-left">
        <h2 class="topbar-title" id="view-title">Обзор</h2>
        <div class="topbar-sub" id="view-sub"></div>
      </div>
      <div class="topbar-right">
        <div class="topbar-group" id="topbar-group"></div>
        <button class="icon-btn" id="btn-logout" title="Выйти">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </header>

    <section class="view-container" id="view-container"></section>
  </main>
</div>

<script src="/app.js"></script>
</body>
</html>
