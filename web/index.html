<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070912">
  <title>Zunno — совместное планирование</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.3.1/dist/driver.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zunno">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#7c5cff">
</head>
<body>

  <div id="preloader" class="preloader">
    <div class="preloader-dot"></div>
    <div class="preloader-dot"></div>
    <div class="preloader-dot"></div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root"></div>
  <div id="sheet-root"></div>

  <div id="command-palette" class="cmdk hidden" role="dialog" aria-modal="true" aria-label="Командная палитра">
    <div class="cmdk-panel glass-strong">
      <div class="cmdk-search">
        <span class="cmdk-icon" aria-hidden="true">⌕</span>
        <input
          id="command-input"
          type="text"
          placeholder="Разделы, группы, действия..."
          autocomplete="off"
          spellcheck="false"
        >
        <kbd>ESC</kbd>
      </div>
      <div id="command-list" class="cmdk-list" role="listbox" aria-label="Команды"></div>
    </div>
  </div>

  <!-- ============ AUTH ============ -->
  <main id="screen-auth" class="screen-auth hidden">
    <div class="auth-shell">
      <button type="button" class="icon-btn auth-theme-btn" data-theme-toggle title="Переключить тему">
        🌙
      </button>

      <div class="auth-brand">
        <div class="brand-mark" aria-hidden="true">Z</div>
        <h1 class="auth-title">Zunno</h1>
        <p class="auth-subtitle">Планируйте вместе. Тратьте осознанно.</p>
      </div>

      <div class="auth-panel glass">
        <div class="segmented" role="tablist" aria-label="Переключение формы">
          <button class="segmented-btn is-active" data-tab="login" type="button" role="tab">Вход</button>
          <button class="segmented-btn" data-tab="register" type="button" role="tab">Регистрация</button>
          <div class="segmented-thumb" aria-hidden="true"></div>
        </div>

        <form id="form-login" class="form" novalidate>
          <label class="field">
            <span class="field-label">Телефон</span>
            <input
              name="phone_number"
              type="tel"
              inputmode="tel"
              autocomplete="tel"
              placeholder="+7 999 123-45-67"
              required
            >
          </label>

          <label class="field">
            <span class="field-label">Пароль</span>
            <input
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="••••••••"
              required
            >
          </label>

          <button type="submit" class="btn btn-primary btn-lg btn-block">Войти</button>
        </form>

        <form id="form-register" class="form hidden" novalidate>
          <label class="field">
            <span class="field-label">Имя</span>
            <input
              name="full_name"
              type="text"
              autocomplete="name"
              placeholder="Иван Иванов"
              minlength="3"
              maxlength="100"
              required
            >
          </label>

          <label class="field">
            <span class="field-label">Возраст</span>
            <input
              name="age"
              type="number"
              inputmode="numeric"
              placeholder="25"
              min="18"
              max="100"
              required
            >
          </label>

          <label class="field">
            <span class="field-label">Телефон</span>
            <input
              name="phone_number"
              type="tel"
              inputmode="tel"
              autocomplete="tel"
              placeholder="+79991234567"
              pattern="^\+[0-9]{9,14}$"
              required
            >
            <span class="field-hint">Формат: +79991234567</span>
          </label>

          <label class="field">
            <span class="field-label">Пароль</span>
            <input
              name="password"
              type="password"
              autocomplete="new-password"
              placeholder="Минимум 8 символов"
              minlength="8"
              required
            >
          </label>

          <button type="submit" class="btn btn-primary btn-lg btn-block">Создать аккаунт</button>
        </form>
      </div>
    </div>
  </main>

  <!-- ============ APP ============ -->
  <div id="screen-app" class="screen-app hidden">

    <aside class="sidebar glass-strong">
      <div class="sidebar-head">
        <div class="brand-mark sm" aria-hidden="true">Z</div>
        <div class="sidebar-brand-text">
          <div class="brand-title">Zunno</div>
          <div class="brand-sub">Совместный бюджет и планы</div>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="Основная навигация">
        <div class="nav-section-label">Работа</div>

        <button type="button" class="nav-item is-active" data-view="dashboard">
          <span class="nav-icon" aria-hidden="true">◧</span>
          <span>Обзор</span>
        </button>

        <button type="button" class="nav-item" data-view="goals">
          <span class="nav-icon" aria-hidden="true">◆</span>
          <span>Цели</span>
        </button>

        <button type="button" class="nav-item" data-view="budget">
          <span class="nav-icon" aria-hidden="true">≡</span>
          <span>Бюджет</span>
        </button>

        <button type="button" class="nav-item" data-view="plans">
          <span class="nav-icon" aria-hidden="true">◷</span>
          <span>Планы</span>
        </button>

        <div class="nav-section-label">Аккаунт</div>

        <button type="button" class="nav-item" data-view="profile">
          <span class="nav-icon" aria-hidden="true">○</span>
          <span>Профиль</span>
        </button>
      </nav>

      <div class="sidebar-group-block">
        <div class="sidebar-label">Группы</div>
        <div id="sidebar-group-list" class="sidebar-group-list"></div>

        <div class="sidebar-group-actions">
          <button type="button" class="btn btn-ghost btn-sm btn-block" id="btn-new-group">
            + Создать группу
          </button>
          <button type="button" class="btn btn-ghost btn-sm btn-block" id="btn-join-group">
            Присоединиться
          </button>
        </div>
      </div>

      <div class="sidebar-user" id="sidebar-user"></div>
    </aside>

    <main class="main">
      <header class="topbar glass-strong">
        <button type="button" class="topbar-group-btn" id="topbar-group-btn">
          <span class="group-avatar" id="topbar-group-avatar" aria-hidden="true">?</span>
          <span class="topbar-group-info">
            <span class="topbar-group-name" id="topbar-group-name">—</span>
            <span class="topbar-group-meta" id="topbar-group-meta"></span>
          </span>
          <span class="caret" aria-hidden="true">▾</span>
        </button>

        <div class="topbar-actions">
          <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" title="Переключить тему" aria-label="Переключить тему">🌙</button>
          <button type="button" class="icon-btn" id="group-settings-btn" data-tip="Настройки группы: переименовать, покинуть, удалить" style="display: none; margin-right: 8px;">
            ⚙
          </button>
          
          <button type="button" class="icon-btn" id="command-btn" title="Команды (Ctrl+K)">
            ⌘
          </button>

          <button type="button" class="icon-btn" data-theme-toggle title="Переключить тему">
            🌙
          </button>

          <button type="button" class="icon-btn" id="topbar-copy-id" data-tip="Скопировать ID группы для приглашения" title="Скопировать ID группы">
            ⧉
          </button>

          <button type="button" class="avatar-btn" id="topbar-user-btn" title="Профиль"></button>
        </div>
      </header>

      <section class="view" id="view"></section>
    </main>

    <nav class="mobile-nav" aria-label="Мобильная навигация">
      <button type="button" class="mobile-nav-item is-active" data-view="dashboard">
        <span class="mobile-nav-icon" aria-hidden="true">◧</span>
        <span class="mobile-nav-label">Обзор</span>
      </button>

      <button type="button" class="mobile-nav-item" data-view="goals">
        <span class="mobile-nav-icon" aria-hidden="true">◆</span>
        <span class="mobile-nav-label">Цели</span>
      </button>

      <button type="button" class="mobile-nav-item" data-view="budget">
        <span class="mobile-nav-icon" aria-hidden="true">≡</span>
        <span class="mobile-nav-label">Бюджет</span>
      </button>

      <button type="button" class="mobile-nav-item" data-view="plans">
        <span class="mobile-nav-icon" aria-hidden="true">◷</span>
        <span class="mobile-nav-label">Планы</span>
      </button>

      <button type="button" class="mobile-nav-item" data-view="profile">
        <span class="mobile-nav-icon" aria-hidden="true">○</span>
        <span class="mobile-nav-label">Профиль</span>
      </button>
    </nav>
  </div>

    <script src="https://cdn.jsdelivr.net/npm/driver.js@1.3.1/dist/driver.js.iife.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script>
    window.onerror = function(msg, url, line, col, error) {
      const preloader = document.getElementById('preloader');
      if (preloader) preloader.classList.add('hide');
      alert("ОШИБКА JS:
" + msg + "

Файл: " + url + "
Строка: " + line);
      return false;
    };
  </script>
  <script src="/app.js"></script>
</body>
</html>
