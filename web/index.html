<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Zunno — Совместный бюджет</title>
  <meta name="description" content="Управляйте совместным бюджетом, планами и целями" />
  <meta name="theme-color" content="#070912" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    html,body,#root{margin:0;padding:0;width:100%;height:100%}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
    #root{display:contents}
  </style>
</head>
<body>
  <div id="root">
    <!-- ═══ AUTH SCREEN ═══ -->
    <div id="screen-auth" class="auth-screen">
      <div class="auth-card">
        <div class="auth-logo">Z</div>
        <h1 class="auth-title" id="auth-title">Вход в Zunno</h1>
        <p class="auth-subtitle" id="auth-subtitle">Управляйте совместным бюджетом</p>
        <form id="auth-form" autocomplete="off">
          <div id="auth-name-group" class="form-group" style="display:none">
            <label class="form-label">Полное имя</label>
            <input type="text" id="auth-name" class="form-input" placeholder="Иван Петров" minlength="3" maxlength="100" />
          </div>
          <div id="auth-age-group" class="form-group" style="display:none">
            <label class="form-label">Возраст</label>
            <input type="number" id="auth-age" class="form-input" placeholder="25" min="18" max="100" />
          </div>
          <div class="form-group">
            <label class="form-label">Телефон</label>
            <input type="tel" id="auth-phone" class="form-input" placeholder="+7 999 123 45 67" pattern="^\+[0-9]{10,14}$" required />
          </div>
          <div class="form-group">
            <label class="form-label">Пароль</label>
            <input type="password" id="auth-password" class="form-input" placeholder="Минимум 8 символов" minlength="8" required />
          </div>
          <button type="submit" class="btn btn-primary btn-full" id="auth-submit">Войти</button>
        </form>
        <div class="auth-footer">
          <span id="auth-switch-text">Нет аккаунта? </span>
          <button type="button" id="auth-switch-btn" class="auth-link">Зарегистрироваться</button>
        </div>
      </div>
    </div>

    <!-- ═══ APP SCREEN ═══ -->
    <div id="screen-app" class="app-layout" style="display:none">
      <!-- Sidebar overlay (mobile) -->
      <div id="sidebar-overlay" class="sidebar-overlay"></div>

      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">Z</div>
          <span class="sidebar-title">Zunno</span>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-section-title">Навигация</div>
          <nav id="sidebar-nav"></nav>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-section-title">Группы</div>
          <div id="sidebar-groups"></div>
          <button class="sidebar-item" id="btn-create-group" style="color:var(--primary)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Создать группу</span>
          </button>
        </div>
        <div style="margin-top:auto;padding:16px 12px">
          <div class="sidebar-section-title">Тема</div>
          <div class="theme-switcher" id="sidebar-themes" style="margin:8px 12px"></div>
        </div>
      </aside>

      <!-- Main content -->
      <div class="main-content">
        <!-- Topbar -->
        <header class="topbar">
          <div class="topbar-left">
            <button class="icon-btn mobile-menu-btn" id="btn-menu" aria-label="Меню">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <div class="group-pill" id="group-pill">
              <div class="avatar sm" id="group-avatar">?</div>
              <span id="group-name">Группа</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
          </div>
          <div class="topbar-right">
            <button class="icon-btn relative" id="btn-invitations" aria-label="Приглашения">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22 6 12 13 2 6"/></svg>
              <span class="badge" id="inv-badge" style="display:none">0</span>
            </button>
            <button class="icon-btn" id="btn-invite" aria-label="Пригласить">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
            </button>
            <div class="theme-switcher" id="topbar-themes"></div>
            <div class="avatar" id="user-avatar" title="Профиль">?</div>
          </div>
        </header>

        <!-- View container -->
        <main id="view-container" class="view"></main>
      </div>

      <!-- Bottom nav (mobile) -->
      <nav class="bottom-nav" id="bottom-nav"></nav>

      <!-- FAB -->
      <div class="fab-container" id="fab">
        <div class="fab-menu" id="fab-menu"></div>
        <button class="fab-main" id="fab-btn" aria-label="Действия">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </div>

    <!-- ═══ MODAL ROOT ═══ -->
    <div id="modal-root" style="pointer-events:none"></div>

    <!-- ═══ TOASTS ═══ -->
    <div id="toasts" class="toasts"></div>

    <!-- ═══ COMMAND PALETTE ═══ -->
    <div id="command-palette" class="modal-overlay" style="display:none;pointer-events:none">
      <div class="modal" style="max-width:560px;pointer-events:auto">
        <div style="padding:16px 20px;border-bottom:1px solid var(--border)">
          <input type="text" id="cmd-input" class="form-input" placeholder="Поиск действий..." style="border:none;background:transparent;font-size:16px;padding:4px 0" />
        </div>
        <div id="cmd-results" style="max-height:400px;overflow-y:auto;padding:8px"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
